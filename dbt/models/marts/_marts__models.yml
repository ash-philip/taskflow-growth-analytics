version: 2

models:
  - name: funnel_activation
    description: "One row per account with funnel-stage flags: signed up, activated, converted."
    columns:
      - name: account_id
        data_tests:
          - unique
          - not_null
      - name: did_signup
        data_tests:
          - not_null

  - name: funnel_summary
    description: "Single-row funnel summary: signup/activation/conversion counts and rates."
    columns:
      - name: total_signups
        data_tests:
            - not_null
      - name: activation_rate
        data_tests:
            - not_null

  - name: retention_cohorts
    description: >
        Cohort retention triangle. One row per (cohort_month, week_number_post_trial).
        cohort_size is the fixed denominator: total distinct Free accounts that started
        in that month. retention_rate = active_accounts / cohort_size. Note: monthly
        Free-account cohorts are small (often 15-35 accounts), so early-week rates are
        noisy, and because "active" means >=1 task in a week, rates can recover
        week-to-week rather than decaying monotonically.
    columns:
      - name: retention_rate
        data_tests:
            - not_null
      - name: cohort_size
        data_tests:
            - not_null

  - name: exp_onboarding_assignment
    description: >
        Experiment 1 (onboarding redesign) analysis table. One row per eligible
        account: assigned arm (control/treatment) and activation outcome. Filtered
        to exp1_eligible accounts only, so 'not_eligible' accounts are excluded.
    columns:
      - name: account_id
        data_tests:
            - unique
            - not_null
      - name: variant
        data_tests:
            - accepted_values:
                arguments:
                  values: [ control , treatment ]

  - name: exp_discount_assignment
    description: >
        Experiment 2 (trial discount framing) analysis table. One row per eligible
        converted account: arm (control/treatment), whether they chose annual billing
        (chose_annual), and trial_period_task_count as a pre-experiment covariate for
        CUPED variance reduction in Phase 4. Filtered to exp2_eligible AND converted.
    columns:
      - name: account_id
        data_tests:
            - unique
            - not_null
      - name: variant
        data_tests:
            - accepted_values:
                arguments:
                  values: [ control, treatment ]
      - name: trial_period_task_count
        data_tests:
            - not_null

  - name: exp_nudge_assignment
    description: >
        Experiment 3 (usage-threshold upgrade nudge) analysis table. One row per
        Free account: crossed_threshold, exp3_nudged (crossed after nudge launch),
        and late_upgraded outcome. NOT randomized -- nudge was shown to accounts
        that self-selected by crossing a usage threshold, so a naive nudged-vs-rest
        comparison is confounded. Kept unfiltered (all Free accounts) so Phase 5
        causal-inference methods have proper comparison groups. Requires DiD /
        propensity matching, not a simple t-test.
    columns:
      - name: account_id
        data_tests:
            - unique
            - not_null
      - name: crossed_threshold
        data_tests:
            - not_null
      - name: exp3_nudged
        data_tests:
            - not_null
      - name: late_upgraded
        data_tests:
            - not_null